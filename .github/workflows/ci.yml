# CI: po każdym pushu GitHub uruchamia testy STAYSI.
# Vercel (Deployment Checks) publikuje nową wersję dopiero, gdy ten test przejdzie.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Zrzuty ekranów z testu wyglądu: do pobrania na stronie przebiegu w zakładce Actions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-ekranow
          path: tests/screens/
          retention-days: 14
